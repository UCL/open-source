name: Build Jekyll site

on:
 push:
   branches: ["main"]
 pull_request:
 schedule:
   - cron: "27 0 * * 1,4"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.1
        with:
          python-version: '3.13'
      - run: pip install pyyaml feedparser
      - name: Update funding opportunities
        run: python .github/rss_2_yaml.py
      - name: Build
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      # The next step uploads a "special" artifact used by the
      # `actions/deploy-pages` below to deploy the website.
      - name: Upload github-pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      # We also want to upload an artifact that can be viewed locally without
      # messing up what the `actions/deploy-pages` workflow expects. To do this,
      # we need first to rename the `_site` directory
      - name: Copy _site to open-source subdirectory
        run: |
          mkdir preview
          cp -r _site preview/open-source
      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Preview
          path: preview
          retention-days: 5

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

  link-checker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Preview
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # nice to check a few specific root-level markdown files (README.md etc) for valid links,
          # but the main thing to check is the rendered website (in the `open-source` directory)
          args: "--github-token ${{ secrets.GITHUB_TOKEN }} --root-dir . -- README.md CONTRIBUTING.md open-source/"
          fail: true
          jobSummary: true
          output: lychee-output.md
      - name: Add Link Checker summary comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: (github.event_name == 'pull_request') && failure()
        with:
          recreate: true
          path: lychee-output.md